name: Sync to Hugging Face Space

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Push clean copy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.WK_TOKEN }}
        run: |
          git config user.email "deploy-bot@github.com"
          git config user.name "Deploy Bot"

          # Remove node_modules and images folders completely
          rm -rf node_modules/
          rm -rf images/

          # Add them to .gitignore
          echo "node_modules/" >> .gitignore
          echo "images/" >> .gitignore

          # Create a brand new orphan branch (no history = no binary files)
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Clean deploy to Hugging Face"

          # Force push this clean branch to HF main
          git push --force https://islammen:$HF_TOKEN@huggingface.co/spaces/islammen/handly_testing hf-deploy:main
